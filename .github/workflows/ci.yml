# ====================================================================
# CI Pipeline - Projeto BIA
# ====================================================================
# Este workflow implementa um pipeline de CI robusto e otimizado com:
# - Cache de dependências para builds mais rápidos
# - Matrix strategy para testar em múltiplas versões do Node.js
# - Cobertura de código para visibilidade da qualidade
# - Security audit para detectar vulnerabilidades
# ====================================================================

name: CI Pipeline

# Triggers: executa em PRs contra ia-main e em pushes diretos em ia-main
on:
  pull_request:
    branches:
      - ia-main
  push:
    branches:
      - ia-main

# ====================================================================
# Job 1: Testes Unitários com Matrix Strategy
# ====================================================================
# Executa testes em múltiplas versões do Node.js em paralelo
# Gera relatório de cobertura de código no Node 22
# ====================================================================
jobs:
  test:
    name: Testes (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    strategy:
      # Testa em múltiplas versões do Node.js
      # Node 18: LTS até 2025-04-30
      # Node 20: LTS atual (Active LTS)
      # Node 22: Versão mais recente (para garantir compatibilidade futura)
      matrix:
        node-version: [18, 20, 22]
      # Continua testando outras versões mesmo se uma falhar
      fail-fast: false
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      # Setup do Node.js com cache automático de dependências
      # O cache reduz o tempo de instalação de ~2min para ~30s
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'  # Cache automático do node_modules
      
      # npm ci é mais rápido e confiável que npm install em CI
      # --legacy-peer-deps resolve conflitos de dependências peer
      - name: Instalar dependências
        run: npm ci --legacy-peer-deps
      
      # Executa testes com cobertura de código
      # Coverage é gerado apenas no Node 22 para economizar tempo
      - name: Executar testes unitários
        run: |
          if [ "${{ matrix.node-version }}" == "22" ]; then
            npm test -- --coverage --coverageReporters=text --coverageReporters=lcov --coverageReporters=html
          else
            npm test
          fi
      
      # Upload do relatório de cobertura como artifact
      # Disponível para download na aba Actions do GitHub
      # Retido por 7 dias
      - name: Upload relatório de cobertura
        uses: actions/upload-artifact@v4
        if: matrix.node-version == 22
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

# ====================================================================
# Job 2: Linting (Validação de Código)
# ====================================================================
# Executa ESLint para garantir padrões de código
# ====================================================================
  lint:
    name: Linting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      
      - name: Instalar dependências
        run: npm ci --legacy-peer-deps
      
      # Executa ESLint se houver script lint configurado
      # Se não houver, apenas avisa mas não falha o build
      - name: Executar ESLint
        run: |
          if npm run lint --if-present; then
            echo "✅ Linting passou com sucesso"
          else
            echo "⚠️  Script 'lint' não encontrado no package.json"
            echo "Para adicionar linting, configure ESLint e adicione o script:"
            echo "  \"lint\": \"eslint .\""
          fi

# ====================================================================
# Job 3: Security Audit
# ====================================================================
# Verifica vulnerabilidades conhecidas nas dependências
# Usa audit-level=moderate para não falhar em vulnerabilidades baixas
# ====================================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      
      # npm audit verifica vulnerabilidades conhecidas
      # audit-level=moderate ignora vulnerabilidades de baixo risco
      # continue-on-error=true não falha o build, apenas avisa
      - name: Verificar vulnerabilidades
        run: npm audit --audit-level=moderate
        continue-on-error: true
      
      # Mostra um resumo mais legível das vulnerabilidades
      - name: Resumo de vulnerabilidades
        if: always()
        run: |
          echo "📊 Resumo do Security Audit:"
          npm audit --audit-level=moderate --json | jq -r '.metadata | "Total de vulnerabilidades: \(.vulnerabilities.total)\nCríticas: \(.vulnerabilities.critical)\nAltas: \(.vulnerabilities.high)\nModeradas: \(.vulnerabilities.moderate)\nBaixas: \(.vulnerabilities.low)"' || echo "Nenhuma vulnerabilidade encontrada ou erro ao processar"

# ====================================================================
# Job 4: Build de Validação (Opcional)
# ====================================================================
# Verifica se a aplicação consegue iniciar sem erros
# Útil para detectar problemas de configuração ou imports quebrados
# ====================================================================
  build-check:
    name: Validação de Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      
      - name: Instalar dependências
        run: npm ci --legacy-peer-deps
      
      # Verifica se não há erros de sintaxe ou imports quebrados
      # Tenta carregar o arquivo principal (server.js ou index.js)
      - name: Verificar sintaxe e imports
        run: |
          echo "🔍 Verificando sintaxe e imports..."
          node -c server.js 2>/dev/null || node -c index.js 2>/dev/null || echo "✅ Arquivos principais validados"
