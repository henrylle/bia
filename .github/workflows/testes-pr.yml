name: 🧪 Testes Unitários — Pull Request

# Dispara em Pull Requests com destino à branch ia_main
on:
  pull_request:
    branches:
      - ia_main

jobs:
  testes:
    name: Executar testes unitários do backend
    runs-on: ubuntu-latest

    steps:
      # 1. Faz checkout do código
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      # 2. Configura Node.js 24.x (versão alinhada ao projeto)
      - name: 🟢 Configurar Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 3. Instala dependências
      - name: 📦 Instalar dependências
        run: npm install

      # 4. Executa os testes unitários do backend (tests/unit/controllers/)
      - name: 🧪 Executar testes unitários
        run: npm test
